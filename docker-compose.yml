x-service-env: &service-env
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a Base64-encoded key of at least 32 bytes}
  JWT_ISSUER: ${JWT_ISSUER:-patient-management-auth}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-patient-management-api}
  PUBLIC_API_DOCS_ENABLED: ${PUBLIC_API_DOCS_ENABLED:-true}
  PUBLIC_METRICS_ENABLED: ${PUBLIC_METRICS_ENABLED:-true}
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.1}
  LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-info}
  AUDIT_CAPTURE_ENABLED: ${AUDIT_CAPTURE_ENABLED:-true}

x-database-env: &database-env
  SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
  SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE:-never}
  SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
  SPRING_FLYWAY_LOCATIONS: ${SPRING_FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/dev-migration}

# Application readiness, including database connectivity where applicable.
x-service-healthcheck: &service-healthcheck
  interval: 10s
  timeout: 5s
  start_period: 60s
  retries: 12

services:
  patient-portal-frontend:
    build:
      context: ./patient-portal-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ""
    image: patient-portal-frontend:latest
    container_name: patient-portal-frontend
    ports:
      - "${FRONTEND_PORT:-8085}:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
    networks:
      - internal

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    image: api-gateway:latest
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:4004/actuator/health"]
    container_name: api-gateway
    environment:
      <<: *service-env
    ports:
      - "4004:4004"
    depends_on:
      auth-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
      ehr-service:
        condition: service_healthy
      insurance-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      inventory-pharmacy-service:
        condition: service_healthy
      audit-compliance-service:
        condition: service_healthy
      patient-portal-service:
        condition: service_healthy
      staff-dashboard-service:
        condition: service_healthy
    networks:
      - internal

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    image: auth-service:latest
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:4005/actuator/health"]
    container_name: auth-service
    environment:
      <<: [*service-env, *database-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/${AUTH_SERVICE_DB_NAME:-auth_service}
      SPRING_DATASOURCE_USERNAME: ${AUTH_SERVICE_DB_USERNAME:-auth_service}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD:-auth_service_dev_password}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
    expose:
      - "4005"
    depends_on:
      auth-service-db:
        condition: service_healthy
    networks:
      - internal

  auth-service-db:
    image: postgres:16-alpine
    container_name: auth-service-db
    environment:
      POSTGRES_DB: ${AUTH_SERVICE_DB_NAME:-auth_service}
      POSTGRES_USER: ${AUTH_SERVICE_DB_USERNAME:-auth_service}
      POSTGRES_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD:-auth_service_dev_password}
    ports:
      - "5001:5432"
    volumes:
      - auth-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  patient-service:
    build:
      context: .
      dockerfile: ./patient-service/Dockerfile
    image: patient-service:latest
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:4000/actuator/health"]
    container_name: patient-service
    environment:
      <<: [*service-env, *database-env]
      BILLING_SERVICE_ADDRESS: ${BILLING_SERVICE_ADDRESS:-billing-service}
      BILLING_SERVICE_GRPC_PORT: ${BILLING_SERVICE_GRPC_PORT:-9001}
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/${PATIENT_SERVICE_DB_NAME:-patient_service}
      SPRING_DATASOURCE_USERNAME: ${PATIENT_SERVICE_DB_USERNAME:-patient_service}
      SPRING_DATASOURCE_PASSWORD: ${PATIENT_SERVICE_DB_PASSWORD:-patient_service_dev_password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    expose:
      - "4000"
    depends_on:
      patient-service-db:

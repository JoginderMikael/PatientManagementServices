  kafka:
    image: dhi.io/kafka:4-debian-native
    container_name: kafka
    # The native image has Bash but no Kafka CLI or curl. Kafka opens this
    # listener after the broker has finished recovery and is ready to serve.
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    environment:
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES:-CONTROLLER}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka:9093}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS:-PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093}
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES:-broker,controller}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}
    ports:
      - "9092:9092"
      - "9093:9093"
    networks:
      - internal

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: patient-management-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.1.4
    container_name: patient-management-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  auth-service-db-data:
  patient-service-db-data:
  billing-service-db-data:
  appointment-service-db-data:
  ehr-service-db-data:
  notification-service-db-data:
  audit-compliance-service-db-data:
  insurance-service-db-data:
  inventory-pharmacy-service-db-data:
  patient-portal-service-db-data:
  staff-dashboard-service-db-data:

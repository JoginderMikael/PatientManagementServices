spring.application.name=inventory-pharmacy-service
server.port=4014
springdoc.api-docs.path=/inventory-pharmacy-v3-api-docs
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:patient-management-auth}
jwt.audience=${JWT_AUDIENCE:patient-management-api}
app.security.public-api-docs=${PUBLIC_API_DOCS_ENABLED:false}
app.security.public-metrics=${PUBLIC_METRICS_ENABLED:false}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
logging.level.root=${LOGGING_LEVEL_ROOT:info}
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory_pharmacy_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.flyway.locations=classpath:db/migration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
app.audit.enabled=${AUDIT_CAPTURE_ENABLED:true}

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api-gateway:4004]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [auth-service:4005]

  - job_name: patient-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [patient-service:4000]

  - job_name: billing-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [billing-service:4001]

  - job_name: analytics-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [analytics-service:4002]

  - job_name: appointment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [appointment-service:4010]

  - job_name: ehr-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ehr-service:4011]

  - job_name: insurance-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [insurance-service:4012]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [notification-service:4013]

  - job_name: inventory-pharmacy-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [inventory-pharmacy-service:4014]

  - job_name: audit-compliance-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [audit-compliance-service:4015]

  - job_name: patient-portal-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [patient-portal-service:4016]

  - job_name: staff-dashboard-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [staff-dashboard-service:4017]

name: Docker smoke test

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Synthetic key for the disposable CI environment only.
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build every application image
        run: docker compose --parallel 2 --progress plain build

      - name: Verify stack startup
        run: docker compose up -d --wait --wait-timeout 300

      - name: Capture container status and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color > docker-smoke.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-smoke-logs
          path: docker-smoke.log

      - name: Stop CI containers
        if: always()
        run: docker compose down

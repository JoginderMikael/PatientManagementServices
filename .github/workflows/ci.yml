name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  maven-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify repository hygiene
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(target|cdk\.out|\.idea)(/|$)|(^|/)\.env$|\.iml$'; then
            echo "Generated output, IDE state, or a local .env file is tracked."
            exit 1
          fi

      - name: Validate local Compose configuration
        env:
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: docker compose config --quiet

      - name: Build all modules
        run: mvn -B clean verify

      - name: Validate synthetic backup and restore
        run: python3 ops/recovery/restore_drill.py

      - name: Validate synthetic FHIR R4 responses
        run: python3 ops/interoperability/validate_fhir.py

      - name: Upload test and performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            integration-tests/target/*-e2e.log
            integration-tests/target/phase3-performance.json
            integration-tests/target/phase4-restore.json
            integration-tests/target/fhir-validation.json
            patient-service/target/fhir-conformance/

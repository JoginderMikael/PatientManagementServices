name: Security readiness
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package dependencies for scanning
        run: mvn -B package -DskipTests
      - name: Verify security gate failure handling
        run: python3 -m unittest discover -s ops/security -p 'test_*.py'
      - name: Generate SBOM and enforce high/critical finding gate
        run: python3 ops/security/scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-readiness
          path: integration-tests/target/security/
          retention-days: 14

spring.application.name=analytics-service
server.port=4002
springdoc.api-docs.path=/analytics-v3-api-docs
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:patient-management-auth}
jwt.audience=${JWT_AUDIENCE:patient-management-api}
app.security.public-api-docs=${PUBLIC_API_DOCS_ENABLED:false}
app.security.public-metrics=${PUBLIC_METRICS_ENABLED:false}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
logging.level.root=${LOGGING_LEVEL_ROOT:info}
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:analytics-service}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

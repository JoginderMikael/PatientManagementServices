spring.application.name=audit-compliance-service
server.port=4015
springdoc.api-docs.path=/audit-compliance-v3-api-docs
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:patient-management-auth}
jwt.audience=${JWT_AUDIENCE:patient-management-api}
app.security.public-api-docs=${PUBLIC_API_DOCS_ENABLED:false}
app.security.public-metrics=${PUBLIC_METRICS_ENABLED:false}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
logging.level.root=${LOGGING_LEVEL_ROOT:info}
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:audit-compliance-service}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/audit_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}

spring.application.name=audit-compliance-service
spring.datasource.url=jdbc:h2:mem:audit-phase4;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.kafka.listener.auto-startup=false
jwt.secret=${JWT_SECRET}
jwt.issuer=patient-management-auth
jwt.audience=patient-management-api
logging.level.root=WARN

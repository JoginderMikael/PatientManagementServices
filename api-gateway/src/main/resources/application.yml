server:
  port: 4004

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:patient-management-auth}
  audience: ${JWT_AUDIENCE:patient-management-api}

app:
  security:
    public-api-docs: ${PUBLIC_API_DOCS_ENABLED:false}
    public-metrics: ${PUBLIC_METRICS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:info}
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /auth-v3-api-docs
      - name: patient-service
        url: /patient-v3-api-docs
      - name: billing-service
        url: /billing-v3-api-docs
      - name: analytics-service
        url: /analytics-v3-api-docs
      - name: appointment-service
        url: /appointment-v3-api-docs
      - name: ehr-service
        url: /ehr-v3-api-docs
      - name: insurance-service
        url: /insurance-v3-api-docs
      - name: notification-service
        url: /notification-v3-api-docs
      - name: inventory-pharmacy-service
        url: /inventory-pharmacy-v3-api-docs
      - name: audit-compliance-service
        url: /audit-compliance-v3-api-docs
      - name: patient-portal-service
        url: /patient-portal-v3-api-docs
      - name: staff-dashboard-service
        url: /staff-dashboard-v3-api-docs
  api-docs:
    enabled: true

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URI:http://auth-service:4005}
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        - id: patient-service-route
          uri: ${PATIENT_SERVICE_URI:http://patient-service:4000}
          predicates:
            - Path=/api/patients/**
          filters:
            - StripPrefix=1

        - id: analytics-service-route
          uri: ${ANALYTICS_SERVICE_URI:http://analytics-service:4002}
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=1

        - id: appointment-service-route
          uri: ${APPOINTMENT_SERVICE_URI:http://appointment-service:4010}
          predicates:
            - Path=/api/appointments/**
          filters:
            - StripPrefix=1

        - id: ehr-service-route
          uri: ${EHR_SERVICE_URI:http://ehr-service:4011}
          predicates:
            - Path=/api/ehr/**
          filters:
            - StripPrefix=1

        - id: insurance-service-route
          uri: ${INSURANCE_SERVICE_URI:http://insurance-service:4012}
          predicates:
            - Path=/api/insurance/**
          filters:
            - StripPrefix=1

        - id: notification-service-route
          uri: ${NOTIFICATION_SERVICE_URI:http://notification-service:4013}
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1

        - id: inventory-pharmacy-service-route
          uri: ${INVENTORY_PHARMACY_SERVICE_URI:http://inventory-pharmacy-service:4014}
          predicates:
            - Path=/api/inventory-pharmacy/**
          filters:
            - StripPrefix=1

        - id: audit-compliance-service-route
          uri: ${AUDIT_COMPLIANCE_SERVICE_URI:http://audit-compliance-service:4015}
          predicates:
            - Path=/api/audit/**
          filters:
            - StripPrefix=1

        - id: patient-portal-service-route
          uri: ${PATIENT_PORTAL_SERVICE_URI:http://patient-portal-service:4016}
          predicates:
            - Path=/api/portal/**
          filters:
            - StripPrefix=1

        - id: staff-dashboard-service-route
          uri: ${STAFF_DASHBOARD_SERVICE_URI:http://staff-dashboard-service:4017}
          predicates:
            - Path=/api/staff-dashboard/**
          filters:
            - StripPrefix=1

        - id: auth-v3-api-docs-route
          uri: ${AUTH_SERVICE_URI:http://auth-service:4005}
          predicates:
            - Path=/auth-v3-api-docs/**

        - id: patient-v3-api-docs-route
          uri: ${PATIENT_SERVICE_URI:http://patient-service:4000}
          predicates:
            - Path=/patient-v3-api-docs/**

        - id: billing-v3-api-docs-route
          uri: ${BILLING_SERVICE_URI:http://billing-service:4001}
          predicates:
            - Path=/billing-v3-api-docs/**

        - id: analytics-v3-api-docs-route
          uri: ${ANALYTICS_SERVICE_URI:http://analytics-service:4002}
          predicates:
            - Path=/analytics-v3-api-docs/**

        - id: appointment-v3-api-docs-route
          uri: ${APPOINTMENT_SERVICE_URI:http://appointment-service:4010}
          predicates:
            - Path=/appointment-v3-api-docs/**

        - id: ehr-v3-api-docs-route
          uri: ${EHR_SERVICE_URI:http://ehr-service:4011}
          predicates:
            - Path=/ehr-v3-api-docs/**

        - id: insurance-v3-api-docs-route
          uri: ${INSURANCE_SERVICE_URI:http://insurance-service:4012}
          predicates:
            - Path=/insurance-v3-api-docs/**

        - id: notification-v3-api-docs-route
          uri: ${NOTIFICATION_SERVICE_URI:http://notification-service:4013}
          predicates:
            - Path=/notification-v3-api-docs/**

        - id: inventory-pharmacy-v3-api-docs-route
          uri: ${INVENTORY_PHARMACY_SERVICE_URI:http://inventory-pharmacy-service:4014}
          predicates:
            - Path=/inventory-pharmacy-v3-api-docs/**

        - id: audit-compliance-v3-api-docs-route
          uri: ${AUDIT_COMPLIANCE_SERVICE_URI:http://audit-compliance-service:4015}
          predicates:
            - Path=/audit-compliance-v3-api-docs/**

        - id: patient-portal-v3-api-docs-route
          uri: ${PATIENT_PORTAL_SERVICE_URI:http://patient-portal-service:4016}
          predicates:
            - Path=/patient-portal-v3-api-docs/**

        - id: staff-dashboard-v3-api-docs-route
          uri: ${STAFF_DASHBOARD_SERVICE_URI:http://staff-dashboard-service:4017}
          predicates:
            - Path=/staff-dashboard-v3-api-docs/**

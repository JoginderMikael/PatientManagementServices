# Production keeps API documentation disabled unless an operator explicitly opts in.
springdoc:
  api-docs:
    enabled: ${PUBLIC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${PUBLIC_API_DOCS_ENABLED:false}

app:
  security:
    public-api-docs: ${PUBLIC_API_DOCS_ENABLED:false}
    public-metrics: ${PUBLIC_METRICS_ENABLED:false}
